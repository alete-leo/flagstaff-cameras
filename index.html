<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Flagstaff Railcam</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <style>
        body {
            margin: 0;
            background: #111;
        }

        video {
            display: block;
            width: 50%;
            height: 50%;
        }
    </style>
</head>

<!-- チャットを使ってごめんね　-->

<body>

<video id="video" controls autoplay muted playsinline></video>

<script>
const video = document.getElementById("video");

const streamUrl =
    "https://1267848452.rsc.cdn77.org/4c121a501355cc1f0c0b851e6f7acf60/rewind-3600.fmp4.m3u8?subscriber_project_id=326664be-310d-4e5f-bdff-e75302af15be";

if (Hls.isSupported()) {
    const hls = new Hls();

    hls.loadSource(streamUrl);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play().catch(() => {
            // Browser may require user interaction before autoplay.
        });
    });

    hls.on(Hls.Events.ERROR, function (event, data) {
        console.error("HLS error:", data);
    });

} else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    // Safari / native HLS
    video.src = streamUrl;

    video.addEventListener("loadedmetadata", function () {
        video.play().catch(() => {});
    });
}
</script>

</body>
</html>
